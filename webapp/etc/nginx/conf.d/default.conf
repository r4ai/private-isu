server {
  listen 80;

  client_max_body_size 10m;
  root /public/;

  location = /favicon.ico {
    try_files $uri =404;
  }

  location /css/ {
    try_files $uri =404;
  }

  location /js/ {
    try_files $uri =404;
  }

  location /img/ {
    try_files $uri =404;
  }

  location /image/ {
    try_files $uri @app;
  }

  location / {
    proxy_set_header Host $host;
    proxy_pass http://app:8080;
  }

  location @app {
    proxy_set_header Host $host;
    proxy_pass http://app:8080;
  }
}
